services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    expose:
      - "8080"

  proxy:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "8080:80"
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/nginx.conf:ro

  k6:
    image: grafana/k6:2.3.0
    depends_on:
      - api
      - proxy
    volumes:
      - ./load:/load:ro
    profiles:
      - load

